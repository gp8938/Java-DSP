name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.version }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Get version from tag
      id: get_version
      run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Generate changelog
      id: changelog
      run: |
        echo "## What's Changed" > changelog.txt
        git log --pretty=format:"- %s (%h)" $(git describe --tags --abbrev=0 HEAD^)..HEAD >> changelog.txt || echo "- Initial release" >> changelog.txt

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v1
      with:
        name: Release ${{ steps.get_version.outputs.version }}
        body_path: changelog.txt
        draft: false
        prerelease: false
        token: ${{ secrets.GITHUB_TOKEN }}

  build-and-upload:
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: java-dsp-linux
            asset_name: java-dsp-${{ needs.create-release.outputs.version }}-linux.jar
            javafx_platform: linux
          - os: macos-latest
            artifact_name: java-dsp-macos
            asset_name: java-dsp-${{ needs.create-release.outputs.version }}-macos.jar
            javafx_platform: mac-aarch64
          - os: windows-latest
            artifact_name: java-dsp-windows
            asset_name: java-dsp-${{ needs.create-release.outputs.version }}-windows.jar
            javafx_platform: win

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: 25
        distribution: 'temurin'
        cache: 'maven'

    - name: Update version in pom.xml
      run: |
        mvn --batch-mode versions:set -DnewVersion=${{ needs.create-release.outputs.version }}
        mvn --batch-mode versions:commit

    - name: Build, test, and verify with Maven
      run: mvn --batch-mode verify -Djava.awt.headless=true -Djavafx.platform=${{ matrix.javafx_platform }}

    - name: Rename artifact
      shell: bash
      run: |
        cp target/DSP-Java-*.jar ${{ matrix.asset_name }}

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: ${{ matrix.asset_name }}

  upload-release-assets:
    needs: [create-release, build-and-upload]
    runs-on: ubuntu-latest
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./artifacts
        merge-multiple: true

    - name: Upload Release Assets
      uses: softprops/action-gh-release@v1
      with:
        files: ./artifacts/*.jar
        token: ${{ secrets.GITHUB_TOKEN }}
