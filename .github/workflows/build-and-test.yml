name: Build and Test

permissions:
  contents: read

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            java: 25
            javafx-platform: linux
          - os: macos-latest
            java: 25
            javafx-platform: mac-aarch64
          - os: windows-latest
            java: 25
            javafx-platform: win

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java }}
        distribution: 'temurin'
        cache: 'maven'

    - name: Build, test, and verify with Maven
      shell: bash
      run: mvn --batch-mode verify -Djava.awt.headless=true -Djavafx.platform=${{ matrix.javafx-platform }}

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.os }}-java${{ matrix.java }}
        path: target/surefire-reports/

    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report-${{ matrix.os }}-java${{ matrix.java }}
        path: target/site/jacoco/

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: java-dsp-${{ matrix.os }}-java${{ matrix.java }}
        path: target/*.jar
